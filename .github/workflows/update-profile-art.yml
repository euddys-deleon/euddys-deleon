name: Actualizar arte del perfil

on:
  schedule:
    - cron: "17 6 * * *" # diario, ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/contributions.json"
      - "city.svg"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_city_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar skyline de contribuciones [skip ci]"
          file_pattern: "data/contributions.json city.svg"
